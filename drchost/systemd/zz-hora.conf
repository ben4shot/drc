# drc usa el reloj del sistema para sus tiempos (tsf_mode=clock): si la hora se corrige
# a mitad de sesion se descuadra. La Pi no tiene RTC: esperar (max 45 s) a que timesyncd sincronice.
[Unit]
After=systemd-timesyncd.service network-online.target
Wants=network-online.target
[Service]
ExecStartPre=-/usr/bin/timeout 45 /usr/lib/systemd/systemd-time-wait-sync
