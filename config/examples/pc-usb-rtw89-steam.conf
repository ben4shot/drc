# Ejemplo: PC con un TP-Link Archer TX20U Plus (rtw89 parcheado) y Steam en la pantalla del GamePad, en una sesión
# propia (cage) sin tocar el escritorio del PC. Cópialo a config/drc.conf y cambia WIFI_IFACE por la tuya (`iw dev`).
# Solo lleva lo de este equipo: los tiempos del adaptador los pone el perfil (config/platforms/usb-rtw89.conf), y el
# resto de ajustes y su explicación están en config/drc.conf.example.

DRC_PLATFORM="usb-rtw89"

WIIU_REGION="jpn"
WIFI_REGDOM="US"
WIFI_IFACE="wlp6s0f3u3"
WIFI_CHANNEL=40

# Sesión propia del GamePad: cage con solo Steam a pantalla completa. Steam admite una instancia por usuario, así que
# el del mando usa su propio HOME (inicio de sesión propio) y comparte tus bibliotecas de juegos.
# Si el Steam del escritorio ya está abierto al empezar, el del mando se le engancha (solo responde HOME): sal del
# del escritorio y vuelve a abrirlo tras empezar la sesión.
DRC_MODE="separate"
DESKTOP_SESSION="cage"
GAMEPAD_AUTOSTART="steam -gamepadui"
GAMEPAD_STEAM_HOME="~/.local/share/drc-gamepad-home"

AUDIO_OUTPUT="gamepad"
AUDIO_BACKEND="auto"
FIREWALL_OPEN="auto"

# Codificador (x264 con los parches DRC): valores afinados con el GamePad. Ver drc.conf.example.
DRC_MV_RANGE=64
DRC_FILLER=1

# Marcas de tiempo como la consola (firmware del mando): START solo arranca un IDR si su marca está en fase con la del
# astrm (±1 ms, módulo 16683,34 µs). DRC_ASTRM_TS_MATCH=1 pone en el astrm la marca del vídeo en cada envío (la consola
# manda la misma en los dos) y DRC_TS_GRID=1 las saca de una rejilla exacta, aunque el envío se retrase por carga.
DRC_TS_GRID=1
DRC_ASTRM_TS_MATCH=1

# Resto de los drop-ins de la Pi (zz-idle-filler.conf, zz-sesion2.conf, zzz-optim.conf), la configuración con la
# que el mando iba bien: relleno también sin imagen nueva, 3 hilos de x264, no pedir otro IDR mientras uno va en
# camino (6 ticks), vaciado del codificador y búfer de audio de 9600.
DRC_IDLE_FILLER=1
DRC_ENC_THREADS=3
DRC_IDR_RESYNC_IGNORE_TICKS=6
DRC_ENC_FLUSH=1
DRC_AUDIO_BUFFER_SIZE=9600
DRC_CRF=14
DRC_QP_MIN=12
DRC_IDR_QP=26
DRC_AQ=1.0
# Bitrate: «max» = calidad variable (DRC_CRF) con VIDEO_BITRATE_KBPS de tope; «fija» = VIDEO_BITRATE_KBPS constante
VIDEO_BITRATE_MODE="max"
VIDEO_BITRATE_KBPS=9300
DRC_FRAME_MAX=26000
# subme 4 en el PC (Elden Ring: enc_max 13 ms, sin pasar de 16,7 ms; el usuario lo ve bien). En la Pi, 2.
DRC_SUBME=4
DRC_ALLOW_PSKIP=1
DRC_NO_INTRA_REFRESH=1
DRC_MIN_CHUNK=4
DRC_ASYNC_ENCODE=1

GAMEPAD_BINDS="HOME+X=close"
