# Configuración de Hyprland para Wii U GamePad (modo separate en PC con Hyprland)
# Resolución fija del GamePad (854x480 a 60 fps) sin efectos pesados para máxima fluidez

monitor = , 854x480@60, 0x0, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

windowrule {
    name = steam-fullscreen
    match:class = ^(steam.*)$
    fullscreen = true
}
