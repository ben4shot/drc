# Perfil de hardware: chip Wi-Fi interno de la Raspberry Pi 4 (Broadcom CYW43455 con brcmfmac y firmware parcheados,
# repo drc-wifi-drivers). Si el chip se cuelga, start_drc.sh ya reinicia brcmfmac y el bus SDIO solo cuando hace falta
# (wlan0 desaparecida o errores en dmesg); un WIFI_RESET_HOOK aquí lo haría en CADA sesión.
VSTRM_PAYLOAD_SIZE=1456
TS_OFFSET_US=9000
TSF_SAWTOOTH_FILTER=1
TSF_RTT_GATE=0
ENABLE_PACING_FQ=1
