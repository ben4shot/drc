# Perfil de hardware: adaptador USB 5 GHz Realtek rtw89 (TP-Link Archer TX20U Plus / RTL8852AU) con el rtw89 de
# morrownr parcheado (repo drc-wifi-drivers: tools/install_rtw89.sh). Sus módulos se llaman *_git
# (rtw89_8852au_git); «modprobe rtw89_8852au» cargaría el del KERNEL, sin TSF, aunque esté en la lista negra.
# Sin WIFI_RESET_HOOK: el driver no necesita recargarse en cada sesión.
# Valores de los drop-ins de la Pi con este mismo TP-Link (wlan1.conf, en uso y medidos hasta el 2026-11-12) y de
# la captura de la Wii U: MTU 1756 y paquetes de 1694 B (1694 + 62 = 1756), no los 1500/1456 del chip interno.
DRC_MTU=1756
VSTRM_PAYLOAD_SIZE=1694
TS_OFFSET_US=17000
TSF_SAWTOOTH_FILTER=0
TSF_RTT_GATE=0
ENABLE_PACING_FQ=1
