# Perfil genérico: un adaptador Wi-Fi 5 GHz con soporte de AP y lectura de TSF (/sys/class/net/<if>/tsf de un
# driver parcheado). Copia este fichero a otro nombre en config/platforms/ para describir tu hardware y elígelo con
# DRC_PLATFORM. Solo valores del hardware: lo de cada equipo (interfaz, canal, modo...) va en drc.conf, que manda.
VSTRM_PAYLOAD_SIZE=1456
TS_OFFSET_US=17000
TSF_SAWTOOTH_FILTER=0
TSF_RTT_GATE=0
ENABLE_PACING_FQ=1
